<div class="container mx-auto px-4 py-8">
  @if (coins().length === 0) {
    <div class="flex justify-center items-center h-64">
      <div class="text-center">
        <div class="inline-block h-8 w-8 animate-spin rounded-full border-4 border-solid border-blue-600 border-r-transparent align-[-0.125em] motion-reduce:animate-[spin_1.5s_linear_infinite]" role="status">
          <span class="!absolute !-m-px !h-px !w-px !overflow-hidden !whitespace-nowrap !border-0 !p-0 ![clip:rect(0,0,0,0)]">Cargando...</span>
        </div>
        <p class="mt-4 text-gray-600">Cargando monedas...</p>
      </div>
    </div>
  } @else {
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-2xl font-bold text-gray-800">
        Top 10 Cryptomonedas
      </h2>
    </div>
    <div class="overflow-x-auto shadow-md sm:rounded-lg">
      <table class="w-full text-sm text-left text-gray-500">
        <thead class="text-xs text-gray-700 uppercase bg-gray-50">
          <tr>
            <th scope="col" class="px-4 py-3"></th>
            <th scope="col" class="px-6 py-3">#</th>
            <th scope="col" class="px-6 py-3">Nombre</th>
            <th scope="col" class="px-6 py-3">Precio</th>
            <th scope="col" class="px-6 py-3">Cambio 24h</th>
            <th scope="col" class="px-6 py-3">Cap. de Mercado</th>
          </tr>
        </thead>
        <tbody>
            @for (coin of coins(); track coin.id; let i = $index) {
              <tr app-cryptocurrencies-top-pst [coin]="coin" [index]="i">
              </tr>
            }
        </tbody>
      </table>
    </div>
  }
</div>
