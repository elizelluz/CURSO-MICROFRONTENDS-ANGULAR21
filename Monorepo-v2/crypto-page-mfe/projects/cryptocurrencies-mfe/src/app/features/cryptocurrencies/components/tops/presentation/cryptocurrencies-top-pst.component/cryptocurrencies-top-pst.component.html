@if (coin()) {
<div class="rounded-xl border border-gray-200 bg-white p-5 hover:shadow-lg transition">
  <div class="flex justify-between items-center">
    <div class="flex items-center gap-3">
      <img
        class="w-10 h-10 rounded-full"
        [src]="coin()?.image"
        [alt]="coin()?.name"
      />

      <div>
        <h3 class="font-semibold text-gray-900">
          {{ coin()?.name }}
        </h3>
        <span class="text-sm text-gray-500 uppercase">
          {{ coin()?.symbol }}
        </span>
      </div>
    </div>
    <button
      type="button"
      (click)="toggleWatchlist()"
      class="text-2xl transition-transform duration-200 hover:scale-110"
      [class.text-yellow-400]="isFavorite()"
      [class.text-gray-300]="!isFavorite()"
    >
      ★
    </button>

  </div>

  <div class="mt-6 flex justify-between items-end">

    <div>
      <div class="text-2xl font-bold text-gray-900">
        ${{ coin()?.current_price?.toLocaleString() }}
      </div>

      <div
        class="text-sm font-medium"
        [class.text-green-600]="coin()?.price_change_percentage_24h! >= 0"
        [class.text-red-600]="coin()?.price_change_percentage_24h! < 0"
      >
        {{ coin()?.price_change_percentage_24h! >= 0 ? '+' : '' }}
        {{ coin()?.price_change_percentage_24h?.toFixed(2) }}%
      </div>
    </div>

    <div class="text-right text-sm text-gray-500">
      <div>Market Cap</div>
      <div class="font-medium text-gray-700">
        ${{ coin()?.market_cap?.toLocaleString() }}
      </div>
    </div>

  </div>

</div>
}
