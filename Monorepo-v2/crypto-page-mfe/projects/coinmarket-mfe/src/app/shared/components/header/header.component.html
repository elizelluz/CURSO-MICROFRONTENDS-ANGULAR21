<nav class="bg-white shadow-lg sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">

      <div class="flex items-center space-x-2">
        <a routerLink="/" class="flex items-center space-x-2">
          <span class="text-2xl font-bold text-blue-600">CoinMarket</span>
        </a>
      </div>

       <!-- [routerLinkActiveOptions]="{exact: true}"  -->
      <div class="hidden md:flex items-center space-x-8">
        <a routerLink="/market" routerLinkActive="text-blue-600 border-b-2 border-blue-600"
           class="text-gray-700 hover:text-blue-600 px-3 py-2 text-sm font-medium transition-colors">
          Top Mercado
        </a>
        <a routerLink="/portfolio" routerLinkActive="text-blue-600 border-b-2 border-blue-600"
           class="text-gray-700 hover:text-blue-600 px-3 py-2 text-sm font-medium transition-colors">
          Watchlist
        </a>
        <a routerLink="/news" routerLinkActive="text-blue-600 border-b-2 border-blue-600"
           class="text-gray-700 hover:text-blue-600 px-3 py-2 text-sm font-medium transition-colors">
          Dasboard
        </a>
      </div>




      <div class="md:hidden flex items-center">
        <button (click)="toggleMenu()" class="text-gray-700 hover:text-blue-600 focus:outline-none">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  [attr.d]="isMenuOpen ? 'M6 18L18 6M6 6l12 12' : 'M4 6h16M4 12h16M4 18h16'" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Menú desplegable para móvil -->
  <div *ngIf="isMenuOpen" class="md:hidden bg-white border-t border-gray-200">
    <div class="px-2 pt-2 pb-3 space-y-1">

      <a routerLink="/market" (click)="toggleMenu()"
         class="block text-gray-700 hover:text-blue-600 px-3 py-2 text-base font-medium">
        Top Mercado
      </a>
      <a routerLink="/portfolio" (click)="toggleMenu()"
         class="block text-gray-700 hover:text-blue-600 px-3 py-2 text-base font-medium">
        Watchlist
      </a>
      <a routerLink="/news" (click)="toggleMenu()"
         class="block text-gray-700 hover:text-blue-600 px-3 py-2 text-base font-medium">
        Dasboard
      </a>
    </div>

  </div>
</nav>
